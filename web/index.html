<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Wiki</title>
<link rel="stylesheet" href="/lib/github-markdown-light.css" id="github-md-light">
<link rel="stylesheet" href="/lib/github-markdown-dark.css" id="github-md-dark" disabled>
<link rel="stylesheet" href="/lib/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="layout">
  <main class="main-left">
    <div class="top-bar">
      <div class="search-bar">
        <input type="text" id="searchInput" class="search-input"
          placeholder="搜索问题、答案或分类..." autocomplete="off" autofocus>
        <span id="searchStatus" class="search-status"></span>
      </div>
      <button id="btnStarFilter" class="btn btn-filter" title="仅显示星标条目">&#11088; 星标</button>
      <button id="btnAllDB" class="btn btn-filter" title="展示所有数据库">全部数据库</button>
      <button id="btnAdd" class="btn btn-primary">+ 新建</button>
    </div>
    <div id="cardContainer" class="card-container">
      <div class="empty-state">加载中...</div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="lock-bar">
        <span id="lockIcon" class="lock-icon" title="点击解锁">&#128274;</span>
        <span id="lockLabel" class="lock-label">仅公开条目</span>
      </div>
      <div id="lockInputRow" class="lock-input-row" hidden>
        <input type="password" id="lockSecretInput" class="field-input" placeholder="输入访问密钥..."
          style="font-size:0.78rem;padding:5px 8px;">
        <button id="btnUnlock" class="btn btn-primary" style="font-size:0.75rem;padding:5px 10px;">解锁</button>
      </div>
    </div>

    <div class="sidebar-section" id="dbSelectorSection">
      <h3 class="sidebar-heading">数据库</h3>
      <div class="db-selector-row">
        <select id="dbSelector" class="db-selector"></select>
        <button id="btnDBRename" class="btn-icon-sm" title="重命名">&#9998;</button>
      </div>
      <div class="db-actions-row">
        <button id="btnDBLoad" class="btn-sm" title="加载数据库">+ 加载</button>
        <button id="btnDBRemove" class="btn-sm btn-remove-db" title="移除数据库">&times; 移除</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-heading">统计</h3>
      <div id="statsContent">
        <div class="stat-row"><span class="stat-label">条目总数</span><span class="stat-value">--</span></div>
        <div class="stat-row"><span class="stat-label">公开条目</span><span class="stat-value">--</span></div>
        <div id="internalStatRow" class="stat-row" hidden>
          <span class="stat-label">内部条目</span><span class="stat-value">--</span></div>
        <div id="starredStatRow" class="stat-row" hidden>
          <span class="stat-label">⭐ 星标条目</span><span class="stat-value">--</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-heading">分类标签</h3>
      <div id="catList" class="cat-list">
        <span class="text-muted" style="font-size:0.78rem;">加载中...</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-heading">最近更新</h3>
      <div id="recentList" class="recent-list">
        <span class="text-muted" style="font-size:0.78rem;">加载中...</span>
      </div>
    </div>

    <div id="dbAdminSection" class="sidebar-section" hidden>
      <h3 class="sidebar-heading">数据管理</h3>
      <div class="db-actions">
        <button id="btnExport" class="btn btn-secondary btn-block">导出全部数据 (.zip)</button>
        <div class="import-row">
          <select id="importMode" class="field-input" style="font-size:0.72rem;padding:4px 6px;flex:1">
            <option value="overwrite">覆盖导入</option>
            <option value="merge">合并导入</option>
            <option value="load_new">加载为新数据库</option>
          </select>
          <button id="btnImport" class="btn btn-secondary" style="flex:1;font-size:0.78rem;padding:6px 10px">导入 (.zip/.db)</button>
        </div>
        <div id="conflictRow" style="display:none">
          <select id="conflictStrategy" class="field-input" style="font-size:0.72rem;padding:4px 6px;width:100%">
            <option value="skip">ID冲突：跳过（保留本地）</option>
            <option value="overwrite">ID冲突：覆盖（导入优先）</option>
            <option value="append">忽略ID：全部追加为新条目</option>
          </select>
        </div>
        <input type="file" id="dbFileInput" accept=".zip,.db" style="display:none">
        <span id="importStatus" class="upload-status"></span>
      </div>
    </div>

    <div class="sidebar-section" style="border-bottom:none">
      <div class="version-info">
        <span class="version-label">QA Wiki</span>
        <span id="versionText" class="version-value">--</span>
      </div>
    </div>
  </aside>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新建条目</h2>
      <button id="btnModalClose" class="btn-icon" title="关闭">&times;</button>
    </div>
    <form id="editForm" autocomplete="off">
      <input type="hidden" id="editId">
      <label class="field">
        <span class="field-label">问题 <span class="required">*</span></span>
        <input type="text" id="editQuestion" class="field-input" required placeholder="输入问题标题...">
      </label>
      <div style="display:flex;gap:12px">
        <label class="field" style="flex:1">
          <span class="field-label">分类标签（逗号分隔多个）</span>
          <input type="text" id="editCategory" class="field-input" placeholder="如：编程, Go, 并发">
        </label>
        <label class="field" style="flex:1">
          <span class="field-label">作者</span>
          <input type="text" id="editAuthor" class="field-input" placeholder="author">
        </label>
        <label class="field" style="flex:0 0 160px">
          <span class="field-label">可见性</span>
          <select id="editVisibility" class="field-input">
            <option value="internal">Internal（内部）</option>
            <option value="public">Public（公开）</option>
          </select>
        </label>
      </div>
      <label class="field field-answer">
        <div class="field-label-row">
          <span>答案（Markdown） <span class="required">*</span></span>
          <span>
            <small class="shortcut-hint">快捷键: B粗 I斜 K链 `码 H标题 U列表 Shift+S删线 Shift+K代码块 Shift+X任务 &gt;引用 M图表 Shift+M公式 Ctrl+-分隔线</small>
            <button type="button" id="btnUpload" class="btn-sm" style="font-size:0.75rem;margin-left:8px">上传文件</button>
            <input type="file" id="fileInput" accept="*/*" style="display:none">
            <span id="uploadStatus" class="upload-status"></span>
          </span>
        </div>
        <textarea id="editAnswer" class="field-input field-textarea" rows="16" required
          placeholder="支持 Markdown 语法。Ctrl+V 粘贴图片，或拖放文件到编辑区。&#10;快捷键：Ctrl+B 加粗 | Ctrl+I 斜体 | Ctrl+K 链接 | Ctrl+` 行内代码"></textarea>
      </label>
      <div class="field-preview" id="fieldPreview" hidden>
        <div class="field-label">预览</div>
        <div id="editPreview" class="markdown-body preview-box"></div>
      <div id="modalResizeHandle" class="modal-resize-handle"></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="btnPreview" class="btn btn-secondary">预览</button>
        <span style="flex:1"></span>
        <button type="button" id="btnModalCancel" class="btn btn-secondary">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Conflict Modal -->
<div id="conflictModal" class="modal-overlay" hidden>
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>名称冲突</h2>
      <button id="btnConflictClose" class="btn-icon" title="关闭">&times;</button>
    </div>
    <div class="modal-body-conflict">
      <p id="conflictMsg"></p>
      <div class="conflict-options">
        <label class="conflict-option">
          <input type="radio" name="conflictAction" value="rename" checked>
          <span>重命名新数据库</span>
          <input type="text" id="conflictNewName" class="field-input" style="margin-top:4px;font-size:0.82rem;">
        </label>
        <label class="conflict-option">
          <input type="radio" name="conflictAction" value="replace">
          <span>替换现有数据库（不从磁盘删除文件）</span>
        </label>
        <label class="conflict-option">
          <input type="radio" name="conflictAction" value="skip">
          <span>跳过（不加载）</span>
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button id="btnConflictCancel" class="btn btn-secondary">取消</button>
      <button id="btnConflictConfirm" class="btn btn-primary">确认</button>
    </div>
  </div>
</div>

<!-- DB Load Modal -->
<div id="dbLoadModal" class="modal-overlay" hidden>
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>加载数据库</h2>
      <button id="btnDBLoadClose" class="btn-icon" title="关闭">&times;</button>
    </div>
    <div class="modal-body-conflict">
      <label class="field">
        <span class="field-label">数据库文件路径（服务器上的 .db 文件路径）</span>
        <input type="text" id="dbLoadPath" class="field-input" placeholder="/path/to/database.db" style="flex:1">
      </label>
      <label class="field">
        <span class="field-label">显示名称（留空则使用数据库中保存的名称）</span>
        <input type="text" id="dbLoadName" class="field-input" placeholder="可选">
      </label>
    </div>
    <div class="modal-actions">
      <span id="dbLoadStatus" class="upload-status"></span>
      <span style="flex:1"></span>
      <button id="btnDBLoadCancel" class="btn btn-secondary">取消</button>
      <button id="btnDBLoadConfirm" class="btn btn-primary">加载</button>
    </div>
  </div>
</div>

<script src="/lib/marked.min.js"></script>
<script src="/lib/mermaid.min.js"></script>
<script src="/lib/katex.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
